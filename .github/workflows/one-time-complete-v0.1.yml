name: One-time Project Context v0.1 completion

on:
  push:
    branches:
      - feature/v0.1

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Extract and run completion recipe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          recipe = Path("tools/one-time-complete-v0.1.recipe")
          lines = recipe.read_text().splitlines()
          marker = next(i for i, line in enumerate(lines) if line.strip() == "run: |")
          script_lines = []
          for line in lines[marker + 1:]:
              script_lines.append(line[10:] if line.startswith("          ") else line)
          script = "\n".join(script_lines) + "\n"
          script = script.replace(
              '          git add --all\n',
              '          rm -f tools/one-time-complete-v0.1.recipe .github/workflows/one-time-complete-v0.1.yml\n          rmdir tools 2>/dev/null || true\n          git add --all\n',
              1,
          )
          Path("/tmp/complete-project-context.sh").write_text(script)
          PY
          bash /tmp/complete-project-context.sh
