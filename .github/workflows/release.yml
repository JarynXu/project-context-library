name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve package version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "okf-project-context-library") | .version')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate builds."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo package --locked

  build:
    needs: [prepare, validate]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build native binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package native binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tarfile
          import zipfile

          target = os.environ["TARGET"]
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"
          ]))
          package = next(item for item in metadata["packages"] if item["name"] == "okf-project-context-library")
          version = package["version"]
          executable = "project-context.exe" if "windows" in target else "project-context"
          source = pathlib.Path("target") / target / "release" / executable
          output = pathlib.Path("dist")
          output.mkdir(exist_ok=True)
          stem = f"project-context-v{version}-{target}"

          if "windows" in target:
              archive = output / f"{stem}.zip"
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
                  bundle.write(source, executable)
                  bundle.write("LICENSE", "LICENSE")
                  bundle.write("README.md", "README.md")
                  bundle.write("CHANGELOG.md", "CHANGELOG.md")
                  bundle.write("skills/project-context/SKILL.md", "skills/project-context/SKILL.md")
          else:
              archive = output / f"{stem}.tar.gz"
              with tarfile.open(archive, "w:gz") as bundle:
                  bundle.add(source, arcname=executable)
                  bundle.add("LICENSE", arcname="LICENSE")
                  bundle.add("README.md", arcname="README.md")
                  bundle.add("CHANGELOG.md", arcname="CHANGELOG.md")
                  bundle.add("skills/project-context/SKILL.md", arcname="skills/project-context/SKILL.md")

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + ".sha256").write_text(
              f"{digest}  {archive.name}\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: project-context-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package source crate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          cp "target/package/okf-project-context-library-${VERSION}.crate" dist/
          (cd dist && sha256sum "okf-project-context-library-${VERSION}.crate" > "okf-project-context-library-${VERSION}.crate.sha256")
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Project Context Library $TAG" \
            --generate-notes
