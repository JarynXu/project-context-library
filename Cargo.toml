[package]
name = "okf-project-context-library"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Concrete OKF Library for durable, revision-aware project context recovery"
license = "Apache-2.0"
repository = "https://github.com/JarynXu/project-context-library"
readme = "README.md"

[[bin]]
name = "project-context"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
